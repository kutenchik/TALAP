[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-admission-journey"
version = "0.1.0"
description = "Factual admission-journey backend"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<6.0",
    "httpx>=0.27,<1.0",
    "lxml_html_clean>=0.4,<1.0",
    "openai>=1.0,<3.0",
    "pydantic>=2.0,<3.0",
    "trafilatura>=2.0,<3.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
]

[project.scripts]
admission = "admission.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
